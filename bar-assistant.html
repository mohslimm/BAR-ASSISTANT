<!DOCTYPE html>
<html lang="en">
<head>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ecf0f1;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
            border-bottom: 3px solid #e74c3c;
        }

            font-size: 3em;
            color: #e74c3c;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: #bdc3c7;
            font-size: 1.1em;
        }

        nav {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        nav button:hover, nav button.active {
            background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .search-bar {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-bar input, .search-bar select {
            padding: 12px 20px;
            border: 2px solid #e74c3c;
            border-radius: 5px;
            background: rgba(255,255,255,0.9);
            font-size: 1em;
            color: #2c3e50;
        }

        .search-bar input {
            width: 300px;
        }

        .search-bar input::placeholder {
            color: #7f8c8d;
        }

        .content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .card {
            background: linear-gradient(135deg, #2a2a4e 0%, #1e1e3f 100%);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #e74c3c;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.3);
            border-color: #f39c12;
        }

        .card-header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            padding: 20px;
            color: white;
        }

        .card-header h3 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .card-category {
            font-size: 0.9em;
            opacity: 0.9;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            border-bottom: 2px solid #e74c3c;
        }

        .card-content {
            padding: 20px;
        }

        .card-description {
            font-size: 0.95em;
            color: #bdc3c7;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.9em;
        }

        .detail-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .detail-label {
            color: #e74c3c;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        .detail-value {
            color: #ecf0f1;
            margin-top: 3px;
        }

        .ingredients-list {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 5px;
            margin-top: 5px;
            font-size: 0.85em;
        }

        .ingredient {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .ingredient:last-child {
            border-bottom: none;
        }

        .expand-btn {
            margin-top: 15px;
            padding: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s ease;
        }

        .expand-btn:hover {
            background: #c0392b;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #2a2a4e 0%, #1e1e3f 100%);
            border-radius: 15px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            border: 2px solid #e74c3c;
            max-height: 90vh;
            overflow-y: auto;

        .modal-header {

            margin-bottom: 20px;
            border-bottom: 2px solid #e74c3c;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #e74c3c;
            font-size: 2em;
        }

        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #c0392b;
            transform: rotate(90deg);
        }

        .modal-section {
            margin-bottom: 25px;
        }

        .modal-section h3 {
            color: #e74c3c;
            margin-bottom: 12px;
            font-size: 1.3em;
            text-transform: uppercase;
            border-bottom: 2px solid #e74c3c;
            padding-bottom: 8px;
        }

        .modal-section p {
            line-height: 1.8;
            color: #bdc3c7;
        }

        .modal-section ul, .modal-section ol {
            margin-left: 20px;
            color: #ecf0f1;
        }

        .modal-section li {
            margin-bottom: 8px;
        }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(0,0,0,0.2);
            margin-bottom: 6px;
            border-radius: 4px;
            border-left: 3px solid #e74c3c;
        }

        .tag {
            display: inline-block;
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            padding: 5px 12px;
            border-radius: 20px;
            margin: 5px 5px 5px 0;
            font-size: 0.85em;
            border: 1px solid #e74c3c;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #bdc3c7;
            font-size: 1.3em;
        }

        .no-results-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            nav {
                flex-direction: column;
            }

            nav button {
                width: 100%;
            }

            .search-bar {
                flex-direction: column;
            }

            .search-bar input, .search-bar select {
                width: 100%;
            }

            .content {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>

        const state = {
          category: "all",
          query: "",
          base: "" // vodka/gin/rum/tequila/whiskey/brandy
        };

        // --- Utils ---
        const byName = (a, b) => a.name.localeCompare(b.name);
        const norm = (s = "") => String(s).toLowerCase();
        const escapeHtml = (s = "") =>
          String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        function debounce(fn, ms = 200) {
          let t;
          return (...args) => {
            clearTimeout(t);
            t = setTimeout(() => fn(...args), ms);
          };
        }

        function allItems() {
          return Object.values(database).flat().slice().sort(byName);
        }

        const itemById = new Map(allItems().map((x) => [String(x.id), x]));

        // --- Rendering ---
        function render() {
          const items = filterItems();
          if (!items.length) {
            contentArea.innerHTML = `
              <div class="no-results">

              </div>
            `;
            return;

          const html = items.map(cardHTML).join("");
          contentArea.innerHTML = html;

        function filterItems() {
          const q = norm(state.query);
          const base = norm(state.base);
          const cat = state.category;

          return allItems().filter((item) => {

            if (cat !== "all" && item.category !== cat) return false;

            // Base spirit filter (applies if item.type matches selected base)
            if (base) {
              if (!item.type || norm(item.type) !== base) return false;
            }

            // Search query: name, type, ingredients
            if (q) {
              const fields = [
                norm(item.name),
                norm(item.type || ""),
                norm(item.description || "")
              ];

              // Ingredients (for cocktails)
              if (Array.isArray(item.ingredients)) {
                fields.push(...item.ingredients.map((ing) => norm(ing.name)));
              }

              // Beer/wine specific
              ["style", "sweetness", "bitterness", "abv", "origin", "glass", "garnish", "difficulty", "strength"]
                .forEach((k) => fields.push(norm(item[k] || "")));

              if (!fields.some((f) => f.includes(q))) return false;
            }

            return true;
          });
        }

        function cap(s) {
          return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
        }

        function cardHTML(item) {
          const hasIngredients = Array.isArray(item.ingredients) && item.ingredients.length;
          const previewIngredients = hasIngredients
            ? `
              <div class="ingredients-list">
                ${item.ingredients.slice(0, 4).map(ing => `
                  <div class="ingredient">
                    <span>${escapeHtml(ing.name)}</span>
                    <span>${escapeHtml(ing.amount || "")}</span>
                  </div>
                `).join("")}
                ${item.ingredients.length > 4 ? `<div style="opacity:.7;font-size:.85em;margin-top:6px">+${item.ingredients.length - 4} more…</div>` : ""}
              </div>
            `
            : "";

          const details = [
            item.type ? detailRow("Base", cap(item.type)) : "",
            item.glass ? detailRow("Glass", item.glass) : "",
            item.garnish ? detailRow("Garnish", item.garnish) : "",
            item.difficulty ? detailRow("Difficulty", item.difficulty) : "",
            item.strength ? detailRow("Strength", item.strength) : "",
            item.style ? detailRow("Style", item.style) : "",
            item.bitterness ? detailRow("Bitterness", item.bitterness) : "",
            item.sweetness ? detailRow("Sweetness", item.sweetness) : "",
            item.abv ? detailRow("ABV", item.abv) : "",
            item.origin ? detailRow("Origin", item.origin) : ""
          ].filter(Boolean).join("");

          return `
            <div class="card" data-id="${String(item.id)}" role="button" tabindex="0" aria-label="Open details for ${escapeHtml(item.name)}">
              <div class="card-header">
                <h3>${escapeHtml(item.name)}</h3>
                <div class="card-category">${escapeHtml(cap(item.category))}</div>
              </div>
              <div class="card-image">${escapeHtml(item.emoji || "🍸")}</div>
              <div class="card-content">
                <p class="card-description">${escapeHtml(item.description || "")}</p>
                <div class="card-details">
                  ${details}
                </div>
                ${previewIngredients}
                <button class="expand-btn" data-id="${String(item.id)}">See details</button>
              </div>
            </div>
          `;
        }

        function detailRow(label, value) {
          return `
            <div class="detail-item">
              <div class="detail-label">${escapeHtml(label)}</div>
              <div class="detail-value">${escapeHtml(value)}</div>
            </div>
          `;
        }

        // --- Modal ---
        function openModal(item) {
          modalTitle.textContent = item.name;

          const tags = [
            item.category ? `<span class="tag">${escapeHtml(cap(item.category))}</span>` : "",
            item.type ? `<span class="tag">${escapeHtml(cap(item.type))}</span>` : "",
            item.difficulty ? `<span class="tag">Difficulty: ${escapeHtml(item.difficulty)}</span>` : "",
            item.strength ? `<span class="tag">Strength: ${escapeHtml(item.strength)}</span>` : "",
            item.abv ? `<span class="tag">ABV: ${escapeHtml(item.abv)}</span>` : ""
          ].filter(Boolean).join("");

          const details = [
            item.glass ? detailRow("Glass", item.glass) : "",
            item.garnish ? detailRow("Garnish", item.garnish) : "",
            item.style ? detailRow("Style", item.style) : "",
            item.bitterness ? detailRow("Bitterness", item.bitterness) : "",
            item.sweetness ? detailRow("Sweetness", item.sweetness) : "",
            item.origin ? detailRow("Origin", item.origin) : ""
          ].filter(Boolean).join("");

          const ingredients = Array.isArray(item.ingredients) && item.ingredients.length
            ? `
              <div class="modal-section">
                <h3>Ingredients</h3>
                <div>
                  ${item.ingredients.map(ing => `
                    <div class="ingredient-item">
                      <span>${escapeHtml(ing.name)}</span>
                      <span>${escapeHtml(ing.amount || "")}</span>
                    </div>
                  `).join("")}
                </div>
              </div>
            `
            : "";

          const method = item.method
            ? `
              <div class="modal-section">
                <h3>Method</h3>
                <ol>
                  ${String(item.method).split(/\n+/).map(step => `<li>${escapeHtml(step.replace(/^\d+\.\s*/, ""))}</li>`).join("")}
                </ol>
              </div>
            `
            : "";

          modalBody.innerHTML = `
            <div class="modal-section">
              <h3>Overview</h3>
              <p>${escapeHtml(item.description || "")}</p>
              <div style="margin-top:10px">${tags}</div>
            </div>

            ${details ? `
              <div class="modal-section">
                <h3>Details</h3>
                ${details}
              </div>` : ""}

            ${ingredients}
            ${method}
          `;

          modal.classList.add("active");
          document.body.style.overflow = "hidden";
        }

        function closeModal() {
          modal.classList.remove("active");
          document.body.style.overflow = "";
        }

        // Expose for close button onclick in HTML
        window.closeModal = closeModal;

        // --- Events ---
        navBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            navBtns.forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            state.category = btn.dataset.category || "all";
            render();
          });
        });

        searchInput.addEventListener("input", debounce((e) => {
          state.query = e.target.value || "";
          render();
        }, 200));

        filterSelect.addEventListener("change", (e) => {
          state.base = e.target.value || "";
          render();
        });

        contentArea.addEventListener("click", (e) => {
          const expandBtn = e.target.closest(".expand-btn");
          const card = e.target.closest(".card");
          const id = expandBtn?.dataset.id || card?.dataset.id;
          if (!id) return;
          const item = itemById.get(String(id));
          if (item) openModal(item);
        });

        contentArea.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            const card = e.target.closest(".card");
            if (!card) return;
            const item = itemById.get(String(card.dataset.id));
            if (item) {
              e.preventDefault();
              openModal(item);
            }
          }
        });

        modal.addEventListener("click", (e) => {
          if (e.target === modal) closeModal();
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && modal.classList.contains("active")) {
            closeModal();
          }
        });

        // --- Init ---
        render();
    </script>
</body>
</html>
