<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Assistant Pro - Cocktails & Spirits Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Quiet Luxury Tokens (01_UI_UX_Design_System.md) */
            --primary: #C9A96E;
            --primary-dark: #B8924A;
            --gold: #C9A96E;
            --gold-glow: rgba(201, 169, 110, 0.12);
            --secondary: #0B1220;
            --accent: #E05252;
            --bg-dark: #07090F;
            --bg-card: rgba(255, 255, 255, 0.035);
            --bg-elevated: #0B1220;
            --text-light: #EDE9E3;
            --text-primary: #EDE9E3;
            --text-gray: rgba(237, 233, 227, 0.45);
            --text-muted: rgba(237, 233, 227, 0.45);
            --border: rgba(255, 255, 255, 0.07);
            --border-gold: rgba(201, 169, 110, 0.30);
            --radius-input: 8px;
            --radius-card: 12px;
            --radius-pill: 20px;

            /* Motion Timing & Easing Tokens (02_Animation_and_Motion.md) */
            --duration-instant: 0ms;
            --duration-fast: 150ms;
            --duration-normal: 300ms;
            --duration-medium: 500ms;
            --duration-slow: 800ms;
            --ease-luxury: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--secondary) 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 0;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(230, 57, 70, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            padding: 60px 20px 40px;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.8rem, 6vw, 4.8rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold) 0%, #F5E6CA 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 20px var(--gold-glow);
        }

        .subtitle {
            color: var(--text-gray);
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav {
            background: rgba(30, 30, 63, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 40px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px var(--shadow);
        }

        nav button {
            padding: 14px 28px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0.05) 100%);
            color: var(--text-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        nav button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 169, 110, 0.25), transparent);
            transform: translateX(-100%);
            transition: transform var(--duration-medium) var(--ease-luxury);
            will-change: transform;
        }

        nav button:hover::before {
            transform: translateX(100%);
        }

        nav button:hover, nav button.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
            color: var(--secondary);
        }

        .search-bar {
            margin-bottom: 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-bar input, .search-bar select {
            padding: 16px 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(30, 30, 63, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 1rem;
            color: var(--text-light);
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }

        .search-bar input {
            flex: 1;
            min-width: 280px;
        }

        .search-bar input::placeholder {
            color: var(--text-gray);
        }

        .search-bar input:focus, .search-bar select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
            background: rgba(30, 30, 63, 0.8);
        }

        .search-bar select {
            min-width: 200px;
            cursor: pointer;
        }

        .content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--radius-card);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform var(--duration-normal) var(--ease-luxury), border-color var(--duration-fast) ease, box-shadow var(--duration-normal) ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            position: relative;
            transform: translateZ(0);
            will-change: transform;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.05) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--primary);
            border-color: var(--primary);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 20px 24px;
            color: var(--secondary);
            position: relative;
            overflow: hidden;
        }

        .card-header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.08) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform var(--duration-medium) var(--ease-luxury);
            will-change: transform;
        }

        .card:hover .card-header::after {
            transform: translateX(100%);
        }

        .card-header h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.75rem;
            margin-bottom: 6px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .card-category {
            font-size: 0.8rem;
            opacity: 0.85;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            z-index: 1;
        }

        .card-image {
            width: 100%;
            height: 260px;
            aspect-ratio: 16 / 10;
            background: linear-gradient(135deg, #14142a 0%, #0b1220 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--duration-medium) var(--ease-luxury);
            will-change: transform;
            transform: translateZ(0);
        }

        .card:hover .card-image img {
            transform: scale(1.1);
        }

        .card-image-placeholder {
            font-size: 5rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        .card-content {
            padding: 24px;
        }

        .card-description {
            font-size: 0.95rem;
            color: var(--text-gray);
            margin-bottom: 20px;
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .detail-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-label {
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .detail-value {
            color: var(--text-light);
            font-weight: 400;
        }

        .ingredients-list {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            font-size: 0.88rem;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .ingredient {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
        }

        .ingredient:last-child {
            border-bottom: none;
        }

        .ingredient-name {
            color: var(--text-light);
        }

        .ingredient-amount {
            color: var(--primary);
            font-weight: 500;
            font-size: 0.85rem;
        }

        .expand-btn {
            margin-top: 20px;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--secondary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .expand-btn:hover {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26, 26, 46, 0.98) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content::-webkit-scrollbar {
            width: 8px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 20px;
            gap: 20px;
        }

        .modal-header h2 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--gold);
            font-size: clamp(2rem, 4.5vw, 2.8rem);
            font-weight: 700;
            flex: 1;
        }

        .close-btn {
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary);
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: var(--primary);
            color: var(--secondary);
            transform: rotate(90deg);
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.4);
        }

        .modal-section {
            margin-bottom: 30px;
        }

        .modal-section h3 {
            color: var(--primary);
            margin-bottom: 16px;
            font-size: 1.3rem;
            text-transform: uppercase;
            border-bottom: 2px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .modal-section p {
            line-height: 1.9;
            color: var(--text-gray);
            font-size: 1.05rem;
        }

        .modal-section ul, .modal-section ol {
            margin-left: 24px;
            color: var(--text-light);
        }

        .modal-section li {
            margin-bottom: 12px;
            line-height: 1.7;
            color: var(--text-gray);
        }

        .modal-section li::marker {
            color: var(--primary);
            font-weight: 600;
        }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
            transition: all 0.2s;
        }

        .ingredient-item:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: translateX(4px);
        }

        .ingredient-item span:first-child {
            color: var(--text-light);
            font-weight: 500;
        }

        .ingredient-item span:last-child {
            color: var(--primary);
            font-weight: 600;
        }

        .tag {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            margin: 5px 8px 5px 0;
            font-size: 0.85rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
            font-weight: 500;
            transition: all 0.2s;
        }

        .tag:hover {
            background: rgba(212, 175, 55, 0.25);
            transform: translateY(-2px);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-gray);
            font-size: 1.3rem;
        }

        .no-results-icon {
            font-size: 5rem;
            margin-bottom: 24px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            header {
                padding: 40px 15px 30px;
                margin-bottom: 30px;
            }

            nav {
                padding: 20px 15px;
                gap: 10px;
            }

            nav button {
                width: 100%;
                padding: 12px 20px;
            }

            .search-bar {
                flex-direction: column;
                gap: 12px;
            }

            .search-bar input, .search-bar select {
                width: 100%;
                min-width: auto;
            }

            .content {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .modal-content {
                padding: 24px;
                border-radius: 20px;
            }

            .modal-header h2 {
                font-size: 1.6rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍸 Bar Assistant</h1>
            <p class="subtitle">Master the Art of Mixology</p>
        </header>

        <nav>
            <button class="nav-btn active" data-category="all">All</button>
            <button class="nav-btn" data-category="cocktails">Classic Cocktails</button>
            <button class="nav-btn" data-category="spirits">Spirits</button>
            <button class="nav-btn" data-category="beers">Beers</button>
            <button class="nav-btn" data-category="wines">Wines</button>
            <button class="nav-btn" data-category="liquors">Liquors</button>
        </nav>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name, ingredient, or type...">
            <select id="filterSelect">
                <option value="">All Types</option>
                <option value="vodka">Vodka-based</option>
                <option value="gin">Gin-based</option>
                <option value="rum">Rum-based</option>
                <option value="tequila">Tequila-based</option>
                <option value="whiskey">Whiskey-based</option>
                <option value="brandy">Brandy-based</option>
            </select>
        </div>

        <div class="content" id="contentArea"></div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // Enhanced Bar Assistant with real cocktail images and Liquor.com recipes

        const database = {
          cocktails: [
            {
              id: 1,
              name: "Margarita",
              category: "cocktails",
              type: "tequila",
              image: "https://images.unsplash.com/photo-1551538827-9c037cb4f32a?w=800&q=80",
              description: "The Margarita is a timeless classic with a perfect balance of tequila, lime, and orange liqueur. Served in a salt-rimmed glass, it's refreshing and sophisticated.",
              ingredients: [
                { name: "Tequila (Blanco)", amount: "2 oz" },
                { name: "Cointreau", amount: "1 oz" },
                { name: "Fresh Lime Juice", amount: "1 oz" },
                { name: "Agave Syrup (optional)", amount: "0.25 oz" }
              ],
              method:
                "1. Rim a rocks glass with salt by running a lime wedge around the rim and dipping it in coarse salt\n" +
                "2. Add tequila, Cointreau, lime juice, and agave syrup to a cocktail shaker with ice\n" +
                "3. Shake vigorously for 15 seconds until well-chilled\n" +
                "4. Strain into the prepared glass over fresh ice\n" +
                "5. Garnish with a lime wheel",
              glass: "Rocks Glass",
              garnish: "Lime wheel, Salt rim",
              difficulty: "Easy",
              strength: "Medium",
              taste: "Citrus, Tangy, Refreshing"
            },
            {
              id: 2,
              name: "Mojito",
              category: "cocktails",
              type: "rum",
              image: "https://images.unsplash.com/photo-1551024506-0bccd828d307?w=800&q=80",
              description: "This refreshing Cuban cocktail combines white rum, fresh mint, lime, and soda water. Perfect for hot summer days with its cooling, herbaceous flavor.",
              ingredients: [
                { name: "White Rum", amount: "2 oz" },
                { name: "Fresh Lime Juice", amount: "0.75 oz" },
                { name: "Simple Syrup", amount: "0.5 oz" },
                { name: "Fresh Mint Leaves", amount: "10-12 leaves" },
                { name: "Club Soda", amount: "2 oz" }
              ],
              method:
                "1. Place mint leaves in a highball glass\n" +
                "2. Add lime juice and simple syrup\n" +
                "3. Gently muddle the mint (don't over-muddle or it will become bitter)\n" +
                "4. Add rum and fill the glass with crushed ice\n" +
                "5. Top with club soda and stir gently\n" +
                "6. Garnish with a mint sprig and lime wedge",
              glass: "Highball",
              garnish: "Mint sprig, Lime wedge",
              difficulty: "Easy",
              strength: "Light",
              taste: "Minty, Fresh, Citrusy"
            },
            {
              id: 3,
              name: "Old Fashioned",
              category: "cocktails",
              type: "whiskey",
              image: "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=800&q=80",
              description: "The Old Fashioned is a sophisticated whiskey cocktail that dates back to the 1800s. It's spirit-forward with subtle sweetness and aromatic bitters.",
              ingredients: [
                { name: "Bourbon or Rye Whiskey", amount: "2 oz" },
                { name: "Simple Syrup", amount: "0.25 oz" },
                { name: "Angostura Bitters", amount: "2-3 dashes" },
                { name: "Orange Peel", amount: "1 piece" }
              ],
              method:
                "1. Add simple syrup and bitters to a rocks glass\n" +
                "2. Add a large ice cube or sphere\n" +
                "3. Pour in the whiskey\n" +
                "4. Stir gently for about 30 seconds to chill and dilute\n" +
                "5. Express orange peel oils over the drink by squeezing the peel\n" +

        // --- DOM Elements ---
        const contentArea = document.getElementById("contentArea");

        const modal = document.getElementById("detailModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalBody = document.getElementById("modalBody");

        // --- State ---
        const state = {
          category: "all",
          query: "",
          base: ""
        };

        // --- Utils ---
        const byName = (a, b) => a.name.localeCompare(b.name);
        const norm = (s = "") => String(s).toLowerCase();
        const escapeHtml = (s = "") =>
          String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        function debounce(fn, ms = 300) {
          let t;
          return (...args) => {
            clearTimeout(t);
            t = setTimeout(() => fn(...args), ms);
          };
        }

        function allItems() {
          return Object.values(database).flat().slice().sort(byName);
        }

        const itemById = new Map(allItems().map((x) => [String(x.id), x]));

        // --- Rendering ---
        function render() {
          const items = filterItems();
          if (!items.length) {
            contentArea.innerHTML = `
              <div class="no-results">
                <div class="no-results-icon">🔍</div>
                <p>No results found. Try a different search or filter.</p>
              </div>
            `;
            return;
          }

          const html = items.map(cardHTML).join("");
          contentArea.innerHTML = html;
        }

        function filterItems() {
          const q = norm(state.query);
          const base = norm(state.base);
          const cat = state.category;

          return allItems().filter((item) => {
            if (cat !== "all" && item.category !== cat) return false;

            if (base) {
              if (!item.type || norm(item.type) !== base) return false;
            }

            if (q) {
              const fields = [
                norm(item.name),
                norm(item.type || ""),
                norm(item.description || "")
              ];

              if (Array.isArray(item.ingredients)) {
                fields.push(...item.ingredients.map((ing) => norm(ing.name)));
              }

              ["style", "sweetness", "bitterness", "abv", "origin", "glass", "garnish", "difficulty", "strength", "taste"]
                .forEach((k) => fields.push(norm(item[k] || "")));

              if (!fields.some((f) => f.includes(q))) return false;
            }

            return true;
          });
        }

        function cap(s) {
          return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
        }

        function cardHTML(item) {
          const hasIngredients = Array.isArray(item.ingredients) && item.ingredients.length;
          const previewIngredients = hasIngredients
            ? `
              <div class="ingredients-list">
                ${item.ingredients.slice(0, 3).map(ing => `
                  <div class="ingredient">
                    <span class="ingredient-name">${escapeHtml(ing.name)}</span>
                    <span class="ingredient-amount">${escapeHtml(ing.amount || "")}</span>
                  </div>
                `).join("")}
                ${item.ingredients.length > 3 ? `<div style="opacity:.6;font-size:.85em;margin-top:10px;text-align:center;color:var(--primary)">+${item.ingredients.length - 3} more ingredients</div>` : ""}
              </div>
            `
            : "";

          const details = [
            item.type ? detailRow("Base", cap(item.type)) : "",
            item.glass ? detailRow("Glass", item.glass) : "",
            item.difficulty ? detailRow("Difficulty", item.difficulty) : "",
            item.strength ? detailRow("Strength", item.strength) : "",
            item.style ? detailRow("Style", item.style) : "",
            item.bitterness ? detailRow("Bitterness", item.bitterness) : "",
            item.sweetness ? detailRow("Sweetness", item.sweetness) : "",
            item.abv ? detailRow("ABV", item.abv) : "",
            item.origin ? detailRow("Origin", item.origin) : ""
          ].filter(Boolean).join("");

          return `
            <div class="card" data-id="${String(item.id)}" role="button" tabindex="0" aria-label="Open details for ${escapeHtml(item.name)}">
              <div class="card-header">
                <h3>${escapeHtml(item.name)}</h3>
                <div class="card-category">${escapeHtml(cap(item.category))}</div>
              </div>
              <div class="card-image">
                ${item.image ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}" width="400" height="260" loading="lazy" decoding="async">` : `<div class="card-image-placeholder">🍸</div>`}
              </div>
              <div class="card-content">
                <p class="card-description">${escapeHtml(item.description || "")}</p>
                <div class="card-details">
                  ${details}
                </div>
                ${previewIngredients}
                <button class="expand-btn" data-id="${String(item.id)}">View Full Recipe</button>
              </div>
            </div>
          `;
        }

        function detailRow(label, value) {
          return `
            <div class="detail-item">
              <div class="detail-label">${escapeHtml(label)}</div>
              <div class="detail-value">${escapeHtml(value)}</div>
            </div>
          `;
        }

        // --- Modal ---
        function openModal(item) {
          modalTitle.textContent = item.name;

          const tags = [
            item.category ? `<span class="tag">${escapeHtml(cap(item.category))}</span>` : "",
            item.type ? `<span class="tag">${escapeHtml(cap(item.type))}</span>` : "",
            item.difficulty ? `<span class="tag">${escapeHtml(item.difficulty)}</span>` : "",
            item.strength ? `<span class="tag">${escapeHtml(item.strength)}</span>` : "",
            item.taste ? `<span class="tag">${escapeHtml(item.taste)}</span>` : "",
            item.abv ? `<span class="tag">${escapeHtml(item.abv)}</span>` : ""
          ].filter(Boolean).join("");

          const details = [
            item.glass ? detailRow("Glass", item.glass) : "",
            item.garnish ? detailRow("Garnish", item.garnish) : "",
            item.style ? detailRow("Style", item.style) : "",
            item.bitterness ? detailRow("Bitterness", item.bitterness) : "",
            item.sweetness ? detailRow("Sweetness", item.sweetness) : "",
            item.origin ? detailRow("Origin", item.origin) : ""
          ].filter(Boolean).join("");

          const ingredients = Array.isArray(item.ingredients) && item.ingredients.length
            ? `
              <div class="modal-section">
                <h3>Ingredients</h3>
                <div>
                  ${item.ingredients.map(ing => `
                    <div class="ingredient-item">
                      <span>${escapeHtml(ing.name)}</span>
                      <span>${escapeHtml(ing.amount || "")}</span>
                    </div>
                  `).join("")}
                </div>
              </div>
            `
            : "";

          const method = item.method
            ? `
              <div class="modal-section">
                <h3>Preparation</h3>
                <ol>
                  ${String(item.method).split(/\n+/).map(step => `<li>${escapeHtml(step.replace(/^\d+\.\s*/, ""))}</li>`).join("")}
                </ol>
              </div>
            `
            : "";

          modalBody.innerHTML = `
            <div class="modal-section">
              <h3>About</h3>
              <p>${escapeHtml(item.description || "")}</p>
              <div style="margin-top:15px">${tags}</div>
            </div>

            ${details ? `
              <div class="modal-section">
                <h3>Details</h3>
                ${details}
              </div>` : ""}

            ${ingredients}
            ${method}
          `;

          modal.classList.add("active");
          document.body.style.overflow = "hidden";
        }

        function closeModal() {
          modal.classList.remove("active");
          document.body.style.overflow = "";
        }

        window.closeModal = closeModal;

        // --- Events ---
        navBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            navBtns.forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            state.category = btn.dataset.category || "all";
            render();
          });
        });

        searchInput.addEventListener("input", debounce((e) => {
          state.query = e.target.value || "";
          render();
        }, 300));

        filterSelect.addEventListener("change", (e) => {
          state.base = e.target.value || "";
          render();
        });

        contentArea.addEventListener("click", (e) => {
          const expandBtn = e.target.closest(".expand-btn");
          const card = e.target.closest(".card");
          const id = expandBtn?.dataset.id || card?.dataset.id;
          if (!id) return;
          const item = itemById.get(String(id));
          if (item) openModal(item);
        });

        contentArea.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            const card = e.target.closest(".card");
            if (!card) return;
            const item = itemById.get(String(card.dataset.id));
            if (item) {
              e.preventDefault();
              openModal(item);
            }
          }
        });

        modal.addEventListener("click", (e) => {
          if (e.target === modal) closeModal();
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && modal.classList.contains("active")) {
            closeModal();
          }
        });

        // --- Init ---
        render();
    </script>
</body>
</html>
